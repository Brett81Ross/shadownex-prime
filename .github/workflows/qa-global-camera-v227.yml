name: ShadowNex v2.2.7 Expanded Camera QA
on:
  push:
    branches: [qa/shadownex-v227-global-camera-gate]
permissions: {contents: read}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: '22'}
      - name: Existing regression + source and direction logic tests
        run: npm test
      - name: Static production build
        run: npm run build
      - name: Verify independent statewide Iowa camera source has genuine media metadata
        run: |
          set -euo pipefail
          curl -fsSL --max-time 30 'https://services.arcgis.com/8lRhdTsQyJpO52F1/arcgis/rest/services/Traffic_Cameras_View/FeatureServer/0/query?where=1%3D1&outFields=*&resultRecordCount=10&outSR=4326&f=geojson' -o /tmp/iowa-cameras.json
          node --input-type=module -e "import fs from 'node:fs';const d=JSON.parse(fs.readFileSync('/tmp/iowa-cameras.json'));if(!d.features?.some(f=>f.properties?.ImageURL))throw Error('Iowa open camera catalog unavailable'); console.log('Iowa official live catalog metadata verified',d.features.length)"
      - name: QA-only Chrome tool
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core
      - name: Local server (no Vercel preview)
        run: |
          node scripts/dev.mjs > /tmp/snx-global-camera.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/snx-global-camera.log
          exit 1
      - name: Real Oklahoma stream on Android, fold transitions, media teardown
        run: node scripts/qa-selected-camera.mjs
