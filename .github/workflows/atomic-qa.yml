name: ShadowNex Atomic QA

on:
  push:
    branches: [main, qa/reconcile-v2.2.1-sbl-07-r3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shadownex-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run ShadowNex QA
        run: npm test
      - name: Verify deterministic static build
        run: npm run build
